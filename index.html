<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="오늘 날씨에 맞춘 남성 패션 코디 추천" />
    <meta name="theme-color" content="#eef0f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14171b" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WeatherFit" />
    <title>WeatherFit — 오늘의 코디</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      브랜드 서체는 제목에만 쓰는 장식이라 이것 때문에 첫 렌더가 밀리면 손해다 (NFR-02).
      media="print"로 받아 두고 다 받은 뒤 all로 바꿔 렌더 블로킹을 피한다.

      crossorigin이 필수다 (QA): 이게 없으면 스타일시트 요청이 no-cors로 나가 불투명(opaque) 응답이
      되고, 서비스워커가 `fresh.ok === false`로 판단해 캐시하지 못한다. 그러면 woff2 파일만 캐시되고
      정작 @font-face 규칙이 담긴 CSS가 없어 오프라인에서 서체가 그대로 깨진다.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap"
      rel="stylesheet"
      crossorigin
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
